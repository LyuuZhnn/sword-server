<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TJKT Subnet Calculator</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    color: white;
    background:
        linear-gradient(rgba(5,8,20,.90), rgba(5,8,20,.96)),
        url("background.jpg") center/cover fixed;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 30px 20px;
}

h1 {
    text-align: center;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin-bottom: 25px;
}

.box {
    padding: 25px;
    border-radius: 20px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(12px);
}

label {
    display: block;
    margin: 15px 0 8px;
    color: #ccc;
}

input, select, button {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.15);
    font-size: 16px;
}

input, select {
    background: rgba(0,0,0,.35);
    color: white;
}

button {
    margin-top: 20px;
    background: rgba(255,255,255,.12);
    color: white;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: rgba(255,255,255,.22);
}

.result {
    margin-top: 25px;
    display: none;
}

.result div {
    padding: 12px;
    margin: 8px 0;
    border-radius: 10px;
    background: rgba(0,0,0,.3);
}

.result span {
    color: #8fffd0;
}

.back {
    display: block;
    margin-top: 20px;
    text-align: center;
    color: #aaa;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

    <h1>🧮 Subnet Calculator</h1>
    <p class="subtitle">TJKT Network Tools</p>

    <div class="box">

        <label>IP Address</label>
        <input id="ip" type="text" placeholder="Contoh: 192.168.1.10">

        <label>Prefix / CIDR</label>
        <select id="prefix">
            <option value="8">/8</option>
            <option value="16">/16</option>
            <option value="24" selected>/24</option>
            <option value="25">/25</option>
            <option value="26">/26</option>
            <option value="27">/27</option>
            <option value="28">/28</option>
            <option value="29">/29</option>
            <option value="30">/30</option>
        </select>

        <button onclick="calculate()">⚡ HITUNG SUBNET</button>

        <div class="result" id="result">

            <div>IP Address: <span id="rIP"></span></div>
            <div>Subnet Mask: <span id="rMask"></span></div>
            <div>Network Address: <span id="rNetwork"></span></div>
            <div>Broadcast: <span id="rBroadcast"></span></div>
            <div>First Host: <span id="rFirst"></span></div>
            <div>Last Host: <span id="rLast"></span></div>
            <div>Jumlah Host: <span id="rHosts"></span></div>

        </div>

    </div>

    <a class="back" href="index.html">← Kembali ke Dashboard</a>

</div>

<script>

function ipToNumber(ip) {

    let parts = ip.split('.');

    if (parts.length !== 4) return null;

    let nums = parts.map(Number);

    for (let n of nums) {
        if (!Number.isInteger(n) || n < 0 || n > 255) {
            return null;
        }
    }

    return ((nums[0] << 24) >>> 0) +
           ((nums[1] << 16) >>> 0) +
           ((nums[2] << 8) >>> 0) +
           nums[3];
}

function numberToIP(num) {

    return [
        (num >>> 24) & 255,
        (num >>> 16) & 255,
        (num >>> 8) & 255,
        num & 255
    ].join('.');
}

function calculate() {

    let ip = document.getElementById("ip").value.trim();
    let prefix = parseInt(document.getElementById("prefix").value);

    let ipNumber = ipToNumber(ip);

    if (ipNumber === null) {
        alert("IP Address tidak valid!");
        return;
    }

    let mask = prefix === 0
        ? 0
        : (0xFFFFFFFF << (32 - prefix)) >>> 0;

    let network = (ipNumber & mask) >>> 0;
    let broadcast = (network | (~mask >>> 0)) >>> 0;

    let maskIP = numberToIP(mask);

    let firstHost;
    let lastHost;
    let hosts;

    if (prefix === 31) {
        firstHost = numberToIP(network);
        lastHost = numberToIP(broadcast);
        hosts = 2;
    } else if (prefix === 32) {
        firstHost = numberToIP(network);
        lastHost = numberToIP(network);
        hosts = 1;
    } else {
        firstHost = numberToIP(network + 1);
        lastHost = numberToIP(broadcast - 1);
        hosts = Math.pow(2, 32 - prefix) - 2;
    }

    document.getElementById("rIP").textContent = ip + "/" + prefix;
    document.getElementById("rMask").textContent = maskIP;
    document.getElementById("rNetwork").textContent = numberToIP(network);
    document.getElementById("rBroadcast").textContent = numberToIP(broadcast);
    document.getElementById("rFirst").textContent = firstHost;
    document.getElementById("rLast").textContent = lastHost;
    document.getElementById("rHosts").textContent = hosts;

    document.getElementById("result").style.display = "block";
}

</script>

</body>
</html>
