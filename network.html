<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Network Info - TJKT Server</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    color: white;

    background:
        linear-gradient(rgba(5,8,20,.90), rgba(5,8,20,.96)),
        url("background.jpg") center/cover fixed;
}

.container {
    max-width: 800px;
    margin: auto;
    padding: 30px 20px;
}

h1 {
    text-align: center;
    font-size: 30px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin-top: 8px;
    margin-bottom: 30px;
}

.box {
    padding: 25px;
    border-radius: 20px;

    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);

    backdrop-filter: blur(12px);

    box-shadow: 0 15px 40px rgba(0,0,0,.35);
}

.info {
    display: flex;
    justify-content: space-between;
    gap: 20px;

    padding: 16px;
    margin-bottom: 12px;

    border-radius: 12px;
    background: rgba(0,0,0,.3);
}

.label {
    color: #aaa;
}

.value {
    color: #8fffd0;
    text-align: right;
    word-break: break-word;
}

.status {
    text-align: center;
    margin-top: 20px;
    padding: 14px;

    border-radius: 12px;

    background: rgba(0,255,150,.1);
    border: 1px solid rgba(0,255,150,.25);

    color: #6effbd;
}

.back {
    display: block;
    margin-top: 25px;

    text-align: center;
    color: #aaa;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

    <h1>📡 Network Information</h1>

    <p class="subtitle">
        TJKT Network Diagnostic
    </p>

    <div class="box">

        <div class="info">
            <span class="label">🌐 Online Status</span>
            <span class="value" id="status">Checking...</span>
        </div>

        <div class="info">
            <span class="label">📱 Device</span>
            <span class="value" id="device">-</span>
        </div>

        <div class="info">
            <span class="label">🌍 Browser</span>
            <span class="value" id="browser">-</span>
        </div>

        <div class="info">
            <span class="label">🖥️ Operating System</span>
            <span class="value" id="os">-</span>
        </div>

        <div class="info">
            <span class="label">📐 Screen Resolution</span>
            <span class="value" id="screen">-</span>
        </div>

        <div class="info">
            <span class="label">📶 Connection</span>
            <span class="value" id="connection">-</span>
        </div>

        <div class="info">
            <span class="label">🕐 Local Time</span>
            <span class="value" id="time">-</span>
        </div>

        <div class="status">
            ● NETWORK CONNECTION ACTIVE
        </div>

    </div>

    <a class="back" href="index.html">
        ← Kembali ke Dashboard
    </a>

</div>

<script>

function getBrowser() {

    let ua = navigator.userAgent;

    if (ua.includes("Chrome")) return "Google Chrome";
    if (ua.includes("Firefox")) return "Mozilla Firefox";
    if (ua.includes("Safari")) return "Safari";
    if (ua.includes("Edge")) return "Microsoft Edge";

    return "Unknown Browser";
}

function getOS() {

    let ua = navigator.userAgent;

    if (ua.includes("Android")) return "Android";
    if (ua.includes("Windows")) return "Windows";
    if (ua.includes("Linux")) return "Linux";
    if (ua.includes("Mac")) return "macOS";
    if (ua.includes("iPhone")) return "iOS";

    return "Unknown OS";
}

function getDevice() {

    let ua = navigator.userAgent;

    if (/Mobi|Android/i.test(ua)) {
        return "📱 Mobile Device";
    }

    return "💻 Desktop / Laptop";
}

function updateInfo() {

    document.getElementById("status").textContent =
        navigator.onLine ? "ONLINE" : "OFFLINE";

    document.getElementById("device").textContent =
        getDevice();

    document.getElementById("browser").textContent =
        getBrowser();

    document.getElementById("os").textContent =
        getOS();

    document.getElementById("screen").textContent =
        screen.width + " × " + screen.height;

    if (navigator.connection) {

        document.getElementById("connection").textContent =
            navigator.connection.effectiveType || "Unknown";

    } else {

        document.getElementById("connection").textContent =
            "Tidak tersedia";

    }

    document.getElementById("time").textContent =
        new Date().toLocaleTimeString();

}

updateInfo();

setInterval(updateInfo, 1000);

</script>

</body>
</html>
